<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">Illustrative Georgia anniversary license plate</title>
  <desc id="plate-desc">A Georgia plate illustration with a 250-year anniversary heading, a Revolutionary War flag motif, the example number ABC123, and a county label.</desc>
  <defs>
    <linearGradient id="plate-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f1e8d3"/>
    </linearGradient>
    <filter id="plate-shadow" x="-5%" y="-8%" width="110%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#25292a" flood-opacity=".16"/>
    </filter>
    <clipPath id="georgia-clip">
      <path d="M84 130 171 130 173 146 182 157 177 172 184 187 176 201 180 214 168 227 165 242 148 251 132 246 121 258 107 250 100 234 91 225 94 209 83 198 90 184 84 171 90 157 84 144Z"/>
    </clipPath>
  </defs>
  <g filter="url(#plate-shadow)">
