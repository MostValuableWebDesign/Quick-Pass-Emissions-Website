      <circle cx="95" cy="153" r="2.5"/><circle cx="111" cy="153" r="2.5"/><circle cx="127" cy="153" r="2.5"/>
      <circle cx="87" cy="166" r="2.5"/><circle cx="103" cy="166" r="2.5"/><circle cx="119" cy="166" r="2.5"/>
    </g>
    <path d="M79 202 144 202 143 254 78 254Z" fill="#173c67"/>
