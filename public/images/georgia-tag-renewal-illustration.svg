  <text x="380" y="91" text-anchor="middle" fill="#201f1d" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700">250 Year Anniversary Revolutionary War</text>
  <path d="M25 103H735" stroke="#b6383e" stroke-width="5"/>
  <path d="M25 109H735" stroke="#faf7ef" stroke-width="2"/>
  <path d="M84 130 171 130 173 146 182 157 177 172 184 187 176 201 180 214 168 227 165 242 148 251 132 246 121 258 107 250 100 234 91 225 94 209 83 198 90 184 84 171 90 157 84 144Z" fill="#f6efe0" stroke="#78818a" stroke-width="2"/>
