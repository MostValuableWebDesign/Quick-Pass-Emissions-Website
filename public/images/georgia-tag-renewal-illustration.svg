    <rect x="24" y="24" width="712" height="292" rx="15" fill="url(#plate-fill)" stroke="#a4a7a4" stroke-width="1.5"/>
  </g>
  <path d="M66 29H694" stroke="#174d6a" stroke-width="4"/>
  <g fill="#d7d8d4" stroke="#a2a4a1" stroke-width="1">
